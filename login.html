<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login · Clinica Central</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/icon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #0f1117; --paper: #f8f6f1; --cream: #ede9e0;
  --accent: #c8392b; --gold: #b8973a; --green: #1a6b3c;
  --radius: 2px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--paper);
  color: var(--ink);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.box {
  background: white;
  border: 1.5px solid var(--ink);
  border-radius: var(--radius);
  padding: 40px 36px;
  width: 100%;
  max-width: 420px;
  position: relative;
}
.box::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 4px;
}
.box.admin::before { background: var(--accent); }
.box.partener::before { background: var(--gold); }
.box.receptioner::before { background: #2c5282; }
.box.pacient::before { background: var(--green); }

.head {
  text-align: center;
  margin-bottom: 28px;
  padding-bottom: 20px;
  border-bottom: 1px solid rgba(15, 17, 23, 0.1);
}
.head .brand {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: rgba(15, 17, 23, 0.5);
  margin-bottom: 12px;
}
.head h1 {
  font-family: 'DM Serif Display', serif;
  font-size: 32px;
  letter-spacing: -0.01em;
}
.head h1 em { font-style: italic; }
.box.admin h1 em { color: var(--accent); }
.box.partener h1 em { color: var(--gold); }
.box.receptioner h1 em { color: #2c5282; }
.box.pacient h1 em { color: var(--green); }

.head .sub {
  font-size: 13px;
  color: rgba(15, 17, 23, 0.5);
  margin-top: 6px;
}

.field { margin-bottom: 16px; }
.field label {
  display: block;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  font-weight: 600;
  margin-bottom: 8px;
  color: rgba(15, 17, 23, 0.7);
}
.field input {
  width: 100%;
  padding: 12px 14px;
  font-family: inherit;
  font-size: 15px;
  border: 1.5px solid rgba(15, 17, 23, 0.2);
  border-radius: var(--radius);
  background: var(--paper);
  outline: none;
}
.field input:focus { border-color: var(--ink); background: white; }

.btn {
  width: 100%;
  padding: 14px;
  background: var(--ink);
  color: var(--paper);
  border: none;
  border-radius: var(--radius);
  font-family: inherit;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  cursor: pointer;
  margin-top: 8px;
}
.btn:hover { background: var(--accent); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

.banner-error {
  background: rgba(200, 57, 43, 0.1);
  border: 1px solid var(--accent);
  color: var(--accent);
  padding: 12px 16px;
  border-radius: var(--radius);
  margin-bottom: 16px;
  font-size: 13px;
  display: none;
}
.banner-error.show { display: block; }

.banner-success {
  background: rgba(26, 107, 60, 0.1);
  border: 1px solid var(--green);
  color: var(--green);
  padding: 16px;
  border-radius: var(--radius);
  margin-bottom: 16px;
  font-size: 13px;
  line-height: 1.5;
  display: none;
}
.banner-success.show { display: block; }
.banner-success strong {
  display: block;
  margin-bottom: 4px;
  font-size: 14px;
}

.info-magic {
  background: rgba(26, 107, 60, 0.06);
  border: 1px solid rgba(26, 107, 60, 0.2);
  border-radius: var(--radius);
  padding: 12px 14px;
  margin-bottom: 16px;
  font-size: 12px;
  color: rgba(15,17,23,0.7);
  line-height: 1.5;
}
.info-magic strong { color: var(--green); }

.foot {
  text-align: center;
  margin-top: 20px;
  font-size: 11px;
  color: rgba(15, 17, 23, 0.5);
  font-family: 'JetBrains Mono', monospace;
  letter-spacing: 0.05em;
}
.foot a { color: rgba(15, 17, 23, 0.6); text-decoration: none; }
.foot a:hover { color: var(--accent); }

.switch-links {
  text-align: center;
  margin-top: 8px;
  font-size: 12px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.switch-links a {
  color: rgba(15,17,23,0.5);
  text-decoration: none;
}
.switch-links a:hover { color: var(--ink); }

/* ═══════ MOBILE OPTIMIZATIONS ═══════ */
@media (max-width: 600px) {
  body { padding: 14px; align-items: flex-start; padding-top: 30px; }
  .box {
    padding: 28px 22px;
    border-radius: 4px;
  }
  .head { margin-bottom: 22px; padding-bottom: 16px; }
  .head h1 { font-size: 26px; }
  .head .sub { font-size: 12px; }

  .field input {
    font-size: 16px !important;  /* prevents iOS zoom */
    padding: 14px 14px;
  }
  .field label { font-size: 11px; }

  .btn {
    padding: 16px;
    font-size: 15px;
  }

  .info-magic {
    padding: 14px;
    font-size: 12px;
  }
}
</style>
</head>
<body>

<div class="box" id="loginBox">
  <header class="head">
    <div class="brand">Clinica Central</div>
    <h1 id="loginTitle">Login</h1>
    <p class="sub" id="loginSub">—</p>
  </header>

  <div class="banner-error" id="errorBox"></div>
  <div class="banner-success" id="successBox"></div>

  <!-- Form pentru admin / partener (cu parolă) -->
  <form id="passwordForm" autocomplete="on" style="display:none">
    <div class="field">
      <label>Email</label>
      <input type="email" id="email" required autocomplete="email" autofocus>
    </div>
    <div class="field">
      <label>Parolă</label>
      <input type="password" id="password" required autocomplete="current-password">
    </div>
    <button type="submit" class="btn" id="submitBtn">Intră în cont →</button>
  </form>

  <!-- Form pentru client (OTP - cod 8 cifre) -->
  <form id="otpStep1Form" autocomplete="on" style="display:none">
    <div class="info-magic">
      <strong>Login fără parolă</strong>
      Introdu email-ul. Vei primi un cod de 8 cifre pe care îl tastezi mai jos.
    </div>

    <div class="field">
      <label>Email</label>
      <input type="email" id="emailOtp" required autocomplete="email" autofocus placeholder="email@example.ro">
    </div>
    <button type="submit" class="btn" id="submitOtpStep1Btn">Trimite cod pe email →</button>
  </form>

  <form id="otpStep2Form" autocomplete="off" style="display:none">
    <div class="info-magic" style="background: rgba(26,107,60,0.08); border-color: var(--green)">
      <strong>Cod trimis ✓</strong>
      Verifică emailul <code id="emailDisplay" style="font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--green)">—</code> și introdu codul de 8 cifre primit.
    </div>

    <div class="field">
      <label>Cod de verificare (8 cifre)</label>
      <input type="text" id="codOtp" required pattern="[0-9]{8}" maxlength="8" autocomplete="one-time-code" inputmode="numeric" placeholder="12345678" style="text-align:center;font-family:'JetBrains Mono',monospace;font-size:24px;letter-spacing:0.2em">
    </div>
    <button type="submit" class="btn" id="submitOtpStep2Btn">Verifică & autentifică →</button>

    <div style="text-align:center;margin-top:14px">
      <button type="button" id="otpResendBtn" style="background:none;border:none;color:rgba(15,17,23,0.55);font-size:12px;cursor:pointer;font-family:inherit;text-decoration:underline">↻ Trimite alt cod</button>
    </div>
  </form>

  <div class="switch-links" id="switchLinks"></div>

  <div class="foot">
    <a href="index.html">← Pagina principală</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="shared/config.js"></script>
<script src="shared/supabase-client.js"></script>
<script>
var params = new URLSearchParams(window.location.search);
var loginType = params.get("type") || "admin";
if (["admin", "partener", "receptioner", "pacient"].indexOf(loginType) < 0) loginType = "admin";

var box = document.getElementById("loginBox");
box.classList.add(loginType);

// Configure UI per type
var titles = {
  admin: { title: 'Login <em>admin</em>', sub: 'Acces panou administrare' },
  partener: { title: 'Login <em>partener</em>', sub: 'Acces pentru admin clinică parteneră' },
  receptioner: { title: 'Login <em>recepție</em>', sub: 'Pentru scanare QR și înregistrare tranzacții' },
  pacient: { title: 'Login <em>client</em>', sub: 'Acces la cardul tău și istoric' }
};
document.getElementById("loginTitle").innerHTML = titles[loginType].title;
document.getElementById("loginSub").textContent = titles[loginType].sub;
document.title = "Login " + (loginType === "pacient" ? "client" : loginType) + " · Clinica Central";

// Dacă userul vine de la card.html (a scanat QR), arată mesaj special
var nextParam = params.get("next") || "";
if (nextParam.indexOf("card.html") >= 0 && loginType === "receptioner") {
  document.getElementById("loginSub").innerHTML =
    '<strong style="color:#2c5282">📱 Pentru a procesa cardul scanat, loghează-te ca recepționer</strong>';
}

// Show appropriate form
if (loginType === "pacient") {
  document.getElementById("otpStep1Form").style.display = "block";
} else {
  // admin, partener, receptioner — toate folosesc password
  document.getElementById("passwordForm").style.display = "block";
}

// Switch links
var switches = {
  admin: [
    { href: "login.html?type=partener", label: "Ești admin partener?" },
    { href: "login.html?type=receptioner", label: "Ești recepționer?" },
    { href: "login.html?type=pacient", label: "Ești client?" }
  ],
  partener: [
    { href: "login.html?type=admin", label: "Ești admin?" },
    { href: "login.html?type=receptioner", label: "Ești recepționer?" },
    { href: "login.html?type=pacient", label: "Ești client?" }
  ],
  receptioner: [
    { href: "login.html?type=admin", label: "Ești admin?" },
    { href: "login.html?type=partener", label: "Ești admin partener?" },
    { href: "login.html?type=pacient", label: "Ești client?" }
  ],
  pacient: [
    { href: "login.html?type=admin", label: "Ești admin?" },
    { href: "login.html?type=partener", label: "Ești admin partener?" },
    { href: "login.html?type=receptioner", label: "Ești recepționer?" }
  ]
};
var switchHtml = "";
switches[loginType].forEach(function(s) {
  switchHtml += '<a href="' + s.href + '">' + s.label + ' →</a>';
});
document.getElementById("switchLinks").innerHTML = switchHtml;

function showError(msg) {
  var b = document.getElementById("errorBox");
  b.textContent = msg;
  b.classList.add("show");
  document.getElementById("successBox").classList.remove("show");
}
function showSuccess(html) {
  var b = document.getElementById("successBox");
  b.innerHTML = html;
  b.classList.add("show");
  document.getElementById("errorBox").classList.remove("show");
}

// Auto-redirect dacă deja logat
(async function() {
  var type = await Clinica.getUserType();
  var next = params.get("next") || "";

  // Caz special: când next=card.html (scan QR), DOAR receptioner sau partener pot continua
  var isCardScan = next.indexOf("card.html") >= 0;
  if (isCardScan && (type === "admin" || type === "pacient")) {
    await Clinica.signOut();
    return;
  }

  if (type === "admin") {
    window.location.href = next || "dashboard.html";
  } else if (type === "partener") {
    window.location.href = next || "partener.html";
  } else if (type === "receptioner") {
    window.location.href = next || "receptie.html";
  } else if (type === "pacient") {
    window.location.href = next || "pacient.html";
  }
})();

// Password login (admin / partener)
document.getElementById("passwordForm").addEventListener("submit", async function(ev) {
  ev.preventDefault();
  var btn = document.getElementById("submitBtn");
  btn.disabled = true;
  btn.textContent = "Se autentifică...";
  document.getElementById("errorBox").classList.remove("show");

  var email = document.getElementById("email").value.trim();
  var password = document.getElementById("password").value;

  var { error } = await Clinica.signIn(email, password);
  if (error) {
    showError("Email sau parolă incorectă.");
    btn.disabled = false;
    btn.textContent = "Intră în cont →";
    return;
  }

  var actualType = await Clinica.getUserType();
  if (!actualType) {
    showError("Contul tău nu are acces la sistem. Contactează administratorul.");
    await Clinica.signOut();
    btn.disabled = false;
    btn.textContent = "Intră în cont →";
    return;
  }

  if (loginType !== actualType) {
    showError("Acest cont e de tip " + actualType + ". Folosește login-ul " + actualType + ".");
    await Clinica.signOut();
    btn.disabled = false;
    btn.textContent = "Intră în cont →";
    return;
  }

  var next = params.get("next");
  if (next) {
    window.location.href = next;
  } else {
    var dest = { admin: "dashboard.html", partener: "partener.html", receptioner: "receptie.html", pacient: "pacient.html" };
    window.location.href = dest[actualType];
  }
});

// OTP login pentru client — Pasul 1: trimite cod pe email
var savedEmail = "";

document.getElementById("otpStep1Form").addEventListener("submit", async function(ev) {
  ev.preventDefault();
  var btn = document.getElementById("submitOtpStep1Btn");
  btn.disabled = true;
  btn.textContent = "Se trimite...";
  document.getElementById("errorBox").classList.remove("show");

  var email = document.getElementById("emailOtp").value.trim().toLowerCase();
  savedEmail = email;

  // signInWithOtp cu shouldCreateUser=true
  // Permitem crearea automată de auth.user pentru clienții adăugați de admin
  // Securitatea e asigurată de RLS - useri fără rol în baza de date nu văd nimic
  var { error } = await sb.auth.signInWithOtp({
    email: email,
    options: {
      shouldCreateUser: true
    }
  });

  if (error) {
    var msg = error.message || "necunoscută";
    if (msg.toLowerCase().indexOf("not found") >= 0 ||
        msg.toLowerCase().indexOf("not authorized") >= 0 ||
        msg.toLowerCase().indexOf("signups not allowed") >= 0) {
      showError("Adresa de email nu este înregistrată în sistem. Contactează Clinica Central pentru a primi cardul de fidelitate.");
    } else if (msg.toLowerCase().indexOf("rate") >= 0) {
      showError("Prea multe încercări. Așteaptă câteva minute și încearcă din nou.");
    } else {
      showError("Eroare la trimitere: " + msg);
    }
    btn.disabled = false;
    btn.textContent = "Trimite cod pe email →";
    return;
  }

  // Comută la pasul 2
  document.getElementById("otpStep1Form").style.display = "none";
  document.getElementById("otpStep2Form").style.display = "block";
  document.getElementById("emailDisplay").textContent = email;
  setTimeout(function() {
    document.getElementById("codOtp").focus();
  }, 100);
});

// OTP login — Pasul 2: verifică cod
document.getElementById("otpStep2Form").addEventListener("submit", async function(ev) {
  ev.preventDefault();
  var btn = document.getElementById("submitOtpStep2Btn");
  btn.disabled = true;
  btn.textContent = "Se verifică...";
  document.getElementById("errorBox").classList.remove("show");

  var token = document.getElementById("codOtp").value.trim();

  if (!/^\d{8}$/.test(token)) {
    showError("Codul trebuie să aibă exact 8 cifre.");
    btn.disabled = false;
    btn.textContent = "Verifică & autentifică →";
    return;
  }

  // verifyOtp cu type='email' pentru cod numeric
  var { data, error } = await sb.auth.verifyOtp({
    email: savedEmail,
    token: token,
    type: 'email'
  });

  if (error) {
    showError("Cod invalid sau expirat. Verifică emailul sau cere alt cod.");
    btn.disabled = false;
    btn.textContent = "Verifică & autentifică →";
    return;
  }

  // Verifică tipul utilizatorului
  // Dacă userul s-a creat în auth.users dar nu există în tabela pacienti,
  // getUserType() va întoarce null și nu vor avea acces (RLS-ul îi blochează)
  var actualType = await Clinica.getUserType();
  if (actualType !== "pacient") {
    showError("Această adresă de email nu este înregistrată ca client al clinicii. Contactează Clinica Central pentru a primi cardul de fidelitate.");
    await Clinica.signOut();
    btn.disabled = false;
    btn.textContent = "Verifică & autentifică →";
    return;
  }

  // Logged in! Redirect
  var next = params.get("next");
  window.location.href = next || "pacient.html";
});

// Resend code
document.getElementById("otpResendBtn").addEventListener("click", async function() {
  if (!savedEmail) return;
  var btn = this;
  btn.disabled = true;
  btn.textContent = "Se retrimite...";
  document.getElementById("errorBox").classList.remove("show");

  var { error } = await sb.auth.signInWithOtp({
    email: savedEmail,
    options: { shouldCreateUser: true }
  });

  btn.disabled = false;
  btn.textContent = "↻ Trimite alt cod";

  if (error) {
    showError("Eroare la retrimitere: " + (error.message || "necunoscută"));
  } else {
    showSuccess('<strong>Cod retrimis ✓</strong>Verifică din nou emailul.');
    setTimeout(function() {
      document.getElementById("successBox").classList.remove("show");
    }, 4000);
  }
});

// Auto-submit când utilizatorul tastează 8 cifre
document.getElementById("codOtp").addEventListener("input", function(ev) {
  this.value = this.value.replace(/[^0-9]/g, "");
  if (this.value.length === 8) {
    document.getElementById("otpStep2Form").requestSubmit();
  }
});
</script>
</body>
</html>
