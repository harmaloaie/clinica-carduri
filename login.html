<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login · Clinica Central</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #0f1117; --paper: #f8f6f1; --cream: #ede9e0;
  --accent: #c8392b; --gold: #b8973a; --green: #1a6b3c;
  --radius: 2px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--paper);
  color: var(--ink);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.box {
  background: white;
  border: 1.5px solid var(--ink);
  border-radius: var(--radius);
  padding: 40px 36px;
  width: 100%;
  max-width: 420px;
  position: relative;
}
.box::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 4px;
}
.box.admin::before { background: var(--accent); }
.box.partener::before { background: var(--gold); }
.box.pacient::before { background: var(--green); }

.head {
  text-align: center;
  margin-bottom: 28px;
  padding-bottom: 20px;
  border-bottom: 1px solid rgba(15, 17, 23, 0.1);
}
.head .brand {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: rgba(15, 17, 23, 0.5);
  margin-bottom: 12px;
}
.head h1 {
  font-family: 'DM Serif Display', serif;
  font-size: 32px;
  letter-spacing: -0.01em;
}
.head h1 em { font-style: italic; }
.box.admin h1 em { color: var(--accent); }
.box.partener h1 em { color: var(--gold); }
.box.pacient h1 em { color: var(--green); }

.head .sub {
  font-size: 13px;
  color: rgba(15, 17, 23, 0.5);
  margin-top: 6px;
}

.field { margin-bottom: 16px; }
.field label {
  display: block;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  font-weight: 600;
  margin-bottom: 8px;
  color: rgba(15, 17, 23, 0.7);
}
.field input {
  width: 100%;
  padding: 12px 14px;
  font-family: inherit;
  font-size: 15px;
  border: 1.5px solid rgba(15, 17, 23, 0.2);
  border-radius: var(--radius);
  background: var(--paper);
  outline: none;
}
.field input:focus { border-color: var(--ink); background: white; }

.btn {
  width: 100%;
  padding: 14px;
  background: var(--ink);
  color: var(--paper);
  border: none;
  border-radius: var(--radius);
  font-family: inherit;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  cursor: pointer;
  margin-top: 8px;
}
.btn:hover { background: var(--accent); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

.banner-error {
  background: rgba(200, 57, 43, 0.1);
  border: 1px solid var(--accent);
  color: var(--accent);
  padding: 12px 16px;
  border-radius: var(--radius);
  margin-bottom: 16px;
  font-size: 13px;
  display: none;
}
.banner-error.show { display: block; }

.banner-success {
  background: rgba(26, 107, 60, 0.1);
  border: 1px solid var(--green);
  color: var(--green);
  padding: 16px;
  border-radius: var(--radius);
  margin-bottom: 16px;
  font-size: 13px;
  line-height: 1.5;
  display: none;
}
.banner-success.show { display: block; }
.banner-success strong {
  display: block;
  margin-bottom: 4px;
  font-size: 14px;
}

.info-magic {
  background: rgba(26, 107, 60, 0.06);
  border: 1px solid rgba(26, 107, 60, 0.2);
  border-radius: var(--radius);
  padding: 12px 14px;
  margin-bottom: 16px;
  font-size: 12px;
  color: rgba(15,17,23,0.7);
  line-height: 1.5;
}
.info-magic strong { color: var(--green); }

.foot {
  text-align: center;
  margin-top: 20px;
  font-size: 11px;
  color: rgba(15, 17, 23, 0.5);
  font-family: 'JetBrains Mono', monospace;
  letter-spacing: 0.05em;
}
.foot a { color: rgba(15, 17, 23, 0.6); text-decoration: none; }
.foot a:hover { color: var(--accent); }

.switch-links {
  text-align: center;
  margin-top: 8px;
  font-size: 12px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.switch-links a {
  color: rgba(15,17,23,0.5);
  text-decoration: none;
}
.switch-links a:hover { color: var(--ink); }
</style>
</head>
<body>

<div class="box" id="loginBox">
  <header class="head">
    <div class="brand">Clinica Central</div>
    <h1 id="loginTitle">Login</h1>
    <p class="sub" id="loginSub">—</p>
  </header>

  <div class="banner-error" id="errorBox"></div>
  <div class="banner-success" id="successBox"></div>

  <!-- Form pentru admin / partener (cu parolă) -->
  <form id="passwordForm" autocomplete="on" style="display:none">
    <div class="field">
      <label>Email</label>
      <input type="email" id="email" required autocomplete="email" autofocus>
    </div>
    <div class="field">
      <label>Parolă</label>
      <input type="password" id="password" required autocomplete="current-password">
    </div>
    <button type="submit" class="btn" id="submitBtn">Intră în cont →</button>
  </form>

  <!-- Form pentru pacient (magic link) -->
  <form id="magicForm" autocomplete="on" style="display:none">
    <div class="info-magic" id="magicInfo">
      <strong>Login fără parolă</strong>
      Introdu email-ul cu care ești înregistrat. Vei primi un link pe email pentru a te conecta — fără să-ți amintești parola.
    </div>

    <div class="field">
      <label>Email</label>
      <input type="email" id="emailMagic" required autocomplete="email" autofocus>
    </div>
    <button type="submit" class="btn" id="submitMagicBtn">Trimite link pe email →</button>
  </form>

  <div class="switch-links" id="switchLinks"></div>

  <div class="foot">
    <a href="index.html">← Pagina principală</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="shared/config.js"></script>
<script src="shared/supabase-client.js"></script>
<script>
var params = new URLSearchParams(window.location.search);
var loginType = params.get("type") || "admin";
if (["admin", "partener", "pacient"].indexOf(loginType) < 0) loginType = "admin";

var box = document.getElementById("loginBox");
box.classList.add(loginType);

// Configure UI per type
var titles = {
  admin: { title: 'Login <em>admin</em>', sub: 'Acces panou administrare' },
  partener: { title: 'Login <em>partener</em>', sub: 'Acces pentru clinici partenere' },
  pacient: { title: 'Login <em>pacient</em>', sub: 'Acces la cardul tău și istoric' }
};
document.getElementById("loginTitle").innerHTML = titles[loginType].title;
document.getElementById("loginSub").textContent = titles[loginType].sub;
document.title = "Login " + loginType + " · Clinica Central";

// Dacă userul vine de la card.html (a scanat QR), arată mesaj special
var nextParam = params.get("next") || "";
if (nextParam.indexOf("card.html") >= 0 && loginType === "partener") {
  document.getElementById("loginSub").innerHTML =
    '<strong style="color:var(--gold)">📱 Pentru a procesa cardul scanat, loghează-te ca partener</strong>';
}

// Show appropriate form
if (loginType === "pacient") {
  document.getElementById("magicForm").style.display = "block";
} else {
  document.getElementById("passwordForm").style.display = "block";
}

// Switch links
var switches = {
  admin: [
    { href: "login.html?type=partener", label: "Ești partener?" },
    { href: "login.html?type=pacient", label: "Ești pacient?" }
  ],
  partener: [
    { href: "login.html?type=admin", label: "Ești admin?" },
    { href: "login.html?type=pacient", label: "Ești pacient?" }
  ],
  pacient: [
    { href: "login.html?type=admin", label: "Ești admin?" },
    { href: "login.html?type=partener", label: "Ești partener?" }
  ]
};
var switchHtml = "";
switches[loginType].forEach(function(s) {
  switchHtml += '<a href="' + s.href + '">' + s.label + ' →</a>';
});
document.getElementById("switchLinks").innerHTML = switchHtml;

function showError(msg) {
  var b = document.getElementById("errorBox");
  b.textContent = msg;
  b.classList.add("show");
  document.getElementById("successBox").classList.remove("show");
}
function showSuccess(html) {
  var b = document.getElementById("successBox");
  b.innerHTML = html;
  b.classList.add("show");
  document.getElementById("errorBox").classList.remove("show");
}

// Auto-redirect dacă deja logat
(async function() {
  var type = await Clinica.getUserType();
  if (type === "admin") {
    var next = params.get("next");
    window.location.href = next || "dashboard.html";
  } else if (type === "partener") {
    var next = params.get("next");
    window.location.href = next || "partener.html";
  } else if (type === "pacient") {
    var next = params.get("next");
    window.location.href = next || "pacient.html";
  }
})();

// Password login (admin / partener)
document.getElementById("passwordForm").addEventListener("submit", async function(ev) {
  ev.preventDefault();
  var btn = document.getElementById("submitBtn");
  btn.disabled = true;
  btn.textContent = "Se autentifică...";
  document.getElementById("errorBox").classList.remove("show");

  var email = document.getElementById("email").value.trim();
  var password = document.getElementById("password").value;

  var { error } = await Clinica.signIn(email, password);
  if (error) {
    showError("Email sau parolă incorectă.");
    btn.disabled = false;
    btn.textContent = "Intră în cont →";
    return;
  }

  var actualType = await Clinica.getUserType();
  if (!actualType) {
    showError("Contul tău nu are acces la sistem. Contactează administratorul.");
    await Clinica.signOut();
    btn.disabled = false;
    btn.textContent = "Intră în cont →";
    return;
  }

  if (loginType !== actualType) {
    showError("Acest cont e de tip " + actualType + ". Folosește login-ul " + actualType + ".");
    await Clinica.signOut();
    btn.disabled = false;
    btn.textContent = "Intră în cont →";
    return;
  }

  var next = params.get("next");
  if (next) {
    window.location.href = next;
  } else {
    var dest = { admin: "dashboard.html", partener: "partener.html", pacient: "pacient.html" };
    window.location.href = dest[actualType];
  }
});

// Magic link login (pacient)
document.getElementById("magicForm").addEventListener("submit", async function(ev) {
  ev.preventDefault();
  var btn = document.getElementById("submitMagicBtn");
  btn.disabled = true;
  btn.textContent = "Se trimite...";
  document.getElementById("errorBox").classList.remove("show");

  var email = document.getElementById("emailMagic").value.trim();

  // Calculează URL-ul de redirect (pacient.html)
  var redirectUrl = window.location.origin + window.location.pathname.replace(/[^/]+$/, "pacient.html");

  var { error } = await Clinica.sendMagicLink(email, redirectUrl);
  if (error) {
    showError("Eroare la trimitere: " + (error.message || "necunoscută"));
    btn.disabled = false;
    btn.textContent = "Trimite link pe email →";
    return;
  }

  // Hide form, show success
  document.getElementById("magicForm").style.display = "none";
  document.getElementById("magicInfo")?.remove();
  showSuccess(
    '<strong>Verifică-ți email-ul ✓</strong>' +
    'Ți-am trimis un link de autentificare la <strong>' + email.replace(/[<>&"']/g, "") + '</strong>. ' +
    'Click pe link-ul din email pentru a te loga. ' +
    '<br><br>Link-ul expiră în 1 oră. Verifică și folder-ul Spam.'
  );
});
</script>
</body>
</html>
