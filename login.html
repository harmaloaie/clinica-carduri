<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login · Clinica Central</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #0f1117; --paper: #f8f6f1; --cream: #ede9e0;
  --accent: #c8392b; --gold: #b8973a; --green: #1a6b3c;
  --radius: 2px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--paper);
  color: var(--ink);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.box {
  background: white;
  border: 1.5px solid var(--ink);
  border-radius: var(--radius);
  padding: 40px 36px;
  width: 100%;
  max-width: 420px;
  position: relative;
}
.box::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 4px;
}
.box.admin::before { background: var(--accent); }
.box.partener::before { background: var(--gold); }

.head {
  text-align: center;
  margin-bottom: 28px;
  padding-bottom: 20px;
  border-bottom: 1px solid rgba(15, 17, 23, 0.1);
}
.head .brand {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: rgba(15, 17, 23, 0.5);
  margin-bottom: 12px;
}
.head h1 {
  font-family: 'DM Serif Display', serif;
  font-size: 32px;
  letter-spacing: -0.01em;
}
.head h1 em { font-style: italic; }
.box.admin h1 em { color: var(--accent); }
.box.partener h1 em { color: var(--gold); }

.head .sub {
  font-size: 13px;
  color: rgba(15, 17, 23, 0.5);
  margin-top: 6px;
}

.field { margin-bottom: 16px; }
.field label {
  display: block;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  font-weight: 600;
  margin-bottom: 8px;
  color: rgba(15, 17, 23, 0.7);
}
.field input {
  width: 100%;
  padding: 12px 14px;
  font-family: inherit;
  font-size: 15px;
  border: 1.5px solid rgba(15, 17, 23, 0.2);
  border-radius: var(--radius);
  background: var(--paper);
  outline: none;
}
.field input:focus { border-color: var(--ink); background: white; }

.btn {
  width: 100%;
  padding: 14px;
  background: var(--ink);
  color: var(--paper);
  border: none;
  border-radius: var(--radius);
  font-family: inherit;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  cursor: pointer;
  margin-top: 8px;
}
.btn:hover { background: var(--accent); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

.banner-error {
  background: rgba(200, 57, 43, 0.1);
  border: 1px solid var(--accent);
  color: var(--accent);
  padding: 12px 16px;
  border-radius: var(--radius);
  margin-bottom: 16px;
  font-size: 13px;
  display: none;
}
.banner-error.show { display: block; }

.foot {
  text-align: center;
  margin-top: 20px;
  font-size: 11px;
  color: rgba(15, 17, 23, 0.5);
  font-family: 'JetBrains Mono', monospace;
  letter-spacing: 0.05em;
}
.foot a { color: rgba(15, 17, 23, 0.6); text-decoration: none; }
.foot a:hover { color: var(--accent); }

.switch-link {
  display: block;
  text-align: center;
  margin-top: 8px;
  font-size: 12px;
}
.switch-link a {
  color: rgba(15,17,23,0.5);
  text-decoration: none;
}
.switch-link a:hover { color: var(--ink); }
</style>
</head>
<body>

<div class="box" id="loginBox">
  <header class="head">
    <div class="brand">Clinica Central</div>
    <h1 id="loginTitle">Login</h1>
    <p class="sub" id="loginSub">—</p>
  </header>

  <div class="banner-error" id="errorBox"></div>

  <form id="loginForm" autocomplete="on">
    <div class="field">
      <label>Email</label>
      <input type="email" id="email" required autocomplete="email" autofocus>
    </div>
    <div class="field">
      <label>Parolă</label>
      <input type="password" id="password" required autocomplete="current-password">
    </div>
    <button type="submit" class="btn" id="submitBtn">Intră în cont →</button>
  </form>

  <div class="switch-link">
    <a href="#" id="switchLink">—</a>
  </div>

  <div class="foot">
    <a href="index.html">← Pagina principală</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="shared/config.js"></script>
<script src="shared/supabase-client.js"></script>
<script>
// Determine login type from URL
var params = new URLSearchParams(window.location.search);
var loginType = params.get("type") || "admin"; // default admin
if (loginType !== "admin" && loginType !== "partener") loginType = "admin";

var box = document.getElementById("loginBox");
box.classList.add(loginType);

// Update UI based on type
if (loginType === "admin") {
  document.getElementById("loginTitle").innerHTML = 'Login <em>admin</em>';
  document.getElementById("loginSub").textContent = "Acces panou administrare";
  document.getElementById("switchLink").href = "login.html?type=partener";
  document.getElementById("switchLink").textContent = "Ești partener? Login partener →";
  document.title = "Login Admin · Clinica Central";
} else {
  document.getElementById("loginTitle").innerHTML = 'Login <em>partener</em>';
  document.getElementById("loginSub").textContent = "Acces pentru clinici partenere";
  document.getElementById("switchLink").href = "login.html?type=admin";
  document.getElementById("switchLink").textContent = "Ești admin? Login admin →";
  document.title = "Login Partener · Clinica Central";
}

function showError(msg) {
  var b = document.getElementById("errorBox");
  b.textContent = msg;
  b.classList.add("show");
}

// Auto-redirect dacă deja logat
(async function() {
  var type = await Clinica.getUserType();
  if (type === "admin") {
    var next = params.get("next");
    window.location.href = next || "dashboard.html";
  } else if (type === "partener") {
    var next = params.get("next");
    window.location.href = next || "partener.html";
  }
})();

document.getElementById("loginForm").addEventListener("submit", async function(ev) {
  ev.preventDefault();
  var btn = document.getElementById("submitBtn");
  btn.disabled = true;
  btn.textContent = "Se autentifică...";
  document.getElementById("errorBox").classList.remove("show");

  var email = document.getElementById("email").value.trim();
  var password = document.getElementById("password").value;

  var { error } = await Clinica.signIn(email, password);
  if (error) {
    showError("Email sau parolă incorectă.");
    btn.disabled = false;
    btn.textContent = "Intră în cont →";
    return;
  }

  // Verifică tipul corect
  var actualType = await Clinica.getUserType();
  if (!actualType) {
    showError("Contul tău nu are acces la sistem. Contactează administratorul.");
    await Clinica.signOut();
    btn.disabled = false;
    btn.textContent = "Intră în cont →";
    return;
  }

  // Dacă tipul real diferă de cel selectat, redirecționăm corect cu mesaj
  if (loginType === "admin" && actualType === "partener") {
    showError("Acest cont e de tip partener. Folosește login-ul partener.");
    await Clinica.signOut();
    btn.disabled = false;
    btn.textContent = "Intră în cont →";
    return;
  }
  if (loginType === "partener" && actualType === "admin") {
    showError("Acest cont e de tip admin. Folosește login-ul admin.");
    await Clinica.signOut();
    btn.disabled = false;
    btn.textContent = "Intră în cont →";
    return;
  }

  // Redirect corect
  var next = params.get("next");
  if (next) {
    window.location.href = next;
  } else {
    window.location.href = actualType === "admin" ? "dashboard.html" : "partener.html";
  }
});
</script>
</body>
</html>
